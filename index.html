    <script>
      // Safe environment shim for sandboxed iframes & fetch property handlers
      (function () {
        if (typeof window === 'undefined') return;

        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;

          function installFetchProperty(obj) {
            if (!obj) return;
            try {
              var descriptor = Object.getOwnPropertyDescriptor(obj, 'fetch');
              if (!descriptor || descriptor.configurable) {
                Object.defineProperty(obj, 'fetch', {
                  get: function () {
                    return customFetch || originalFetch;
                  },
                  set: function (fn) {
                    customFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e) {}
          }

          installFetchProperty(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            installFetchProperty(Window.prototype);
          }
        } catch (e) {}

        // Global safety error listeners
        window.addEventListener(
          'error',
          function (e) {
            var msg = e && (e.message || (e.error && e.error.message));
            if (typeof msg === 'string' && msg.includes('fetch') && msg.includes('getter')) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var msg = e && e.reason && (e.reason.message || String(e.reason));
            if (typeof msg === 'string' && msg.includes('fetch') && msg.includes('getter')) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
